<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sameh Store | روابط التواصل والدفع</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* التنسيقات العامة */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* خلفية فاتحة وعصرية بتدرج هادئ */
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* حاوية الصفحة الرئيسية (بطاقة بيضاء فاتحة) */
        .container {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            position: relative;
        }

        /* تنسيق اللوجو */
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #e11d48;
            margin-bottom: 15px;
        }

        /* تنسيق اسم المتجر */
        h1 {
            color: #1e293b;
            font-size: 1.6rem;
            margin-bottom: 5px;
        }

        /* تنسيق الوصف */
        p {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        /* حاوية الأزرار */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* تنسيق الزر العام */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            border: none;
            width: 100%;
        }

        /* تأثير لمسة الإصبع للأجهزة الذكية */
        .link-btn:active {
            transform: scale(0.98);
        }

        /* تنسيق الأيقونة داخل الزر */
        .link-btn i {
            font-size: 1.4rem;
        }

        /* الألوان الظاهرة دائماً لكل زر */
        .facebook-btn { background-color: #1877f2; }
        .tiktok-btn { background-color: #000000; }
        .maps-btn { background-color: #ea4335; }
        .phone-btn { background-color: #0284c7; }
        .whatsapp-btn { background-color: #25d366; }
        .vodafone-btn { background-color: #e60000; }
        .instapay-btn { background-color: #5b2c6f; }

        /* رسالة التنبيه عند النسخ */
        .toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            z-index: 1000;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.95rem;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .toast.show {
            visibility: visible;
            opacity: 1;
        }

    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="Sameh Store Logo" class="profile-img">
        
        <h1>Sameh Store</h1>
        <p>phone repair & accessories</p>

        <div class="links-container">
            <a href="https://www.facebook.com/share/1Je7fBPV23/" target="_blank" class="link-btn facebook-btn">
                فيسبوك <i class="fab fa-facebook"></i>
            </a>

            <a href="https://www.tiktok.com/@sameh_store87?_r=1&_t=ZS-99E68e6NwhR" target="_blank" class="link-btn tiktok-btn">
                تيك توك <i class="fab fa-tiktok"></i>
            </a>

            <a href="https://maps.app.goo.gl/xUicmwJJADEfgXDe9?g_st=aw" target="_blank" class="link-btn maps-btn">
                موقعنا على الخريطة <i class="fas fa-map-marker-alt"></i>
            </a>

            <a href="tel:+201121618190" class="link-btn phone-btn">
                اتصل بنا <i class="fas fa-phone"></i>
            </a>

            <a href="https://wa.me/201095913922" target="_blank" class="link-btn whatsapp-btn">
                واتساب <i class="fab fa-whatsapp"></i>
            </a>

            <!-- زر فودافون كاش مع خاصية النسخ -->
            <button onclick="copyVodafoneNumber()" class="link-btn vodafone-btn">
                فودافون كاش <i class="fas fa-wallet"></i>
            </button>

            <!-- انستا باي -->
            <a href="https://ipn.eg/S/samehstore87/instapay/6MXNqQ" target="_blank" class="link-btn instapay-btn">
                الدفع عبر InstaPay <i class="fas fa-university"></i>
            </a>
        </div>
    </div>

    <!-- رسالة التنبيه المنسدلة عند النسخ -->
    <div id="toast" class="toast">تم نسخ رقم فودافون كاش بنجاح!</div>

    <script>
        function copyVodafoneNumber() {
            const phoneNumber = "01095913922";
            
            // نسخ الرقم للحافظة
            navigator.clipboard.writeText(phoneNumber).then(function() {
                // إظهار رسالة التنبيه
                const toast = document.getElementById("toast");
                toast.className = "toast show";
                
                // إخفاء الرسالة بعد ثانيتين
                setTimeout(function(){ 
                    toast.className = toast.className.replace("show", ""); 
                }, 2000);
            });
        }
    </script>

</body>
</html>
