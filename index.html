<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sameh Store</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg1:#fbeaea;--bg2:#f4e4ec;--o1:#f87171;--o2:#fb923c;--o3:#e11d48;--ink:#0f1f33;--mute:#4b607a;
--glass:rgba(255,255,255,.42);--glass-h:rgba(255,255,255,.62);--edge:rgba(255,255,255,.75);--shadow:rgba(31,54,92,.18);--accent:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#12060a;--bg2:#1d0a14;--o1:#e11d2a;--o2:#9a3412;--o3:#be123c;--ink:#eef4ff;--mute:#9db0cc;
--glass:rgba(255,255,255,.08);--glass-h:rgba(255,255,255,.15);--edge:rgba(255,255,255,.2);--shadow:rgba(0,0,0,.45);--accent:#ef4444}}
:root[data-theme="dark"]{--bg1:#12060a;--bg2:#1d0a14;--o1:#e11d2a;--o2:#9a3412;--o3:#be123c;--ink:#eef4ff;--mute:#9db0cc;
--glass:rgba(255,255,255,.08);--glass-h:rgba(255,255,255,.15);--edge:rgba(255,255,255,.2);--shadow:rgba(0,0,0,.45);--accent:#ef4444}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;display:flex;justify-content:center;color:var(--ink);font-family:"Cairo",Tahoma,Arial,sans-serif;
background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;position:relative;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.75;pointer-events:none;z-index:0}
.o1{width:300px;height:300px;background:var(--o1);top:-80px;right:-80px}
.o2{width:340px;height:340px;background:var(--o2);bottom:-100px;left:-100px}
.o3{width:220px;height:220px;background:var(--o3);top:45%;right:-90px;opacity:.5}
main{position:relative;z-index:1;width:100%;max-width:460px;padding:44px 18px 40px}
header{text-align:center;margin-bottom:30px}
.logo{width:88px;height:88px;margin:0 auto 16px;border-radius:26px;display:grid;place-items:center;
background:var(--glass);border:1px solid var(--edge);box-shadow:0 12px 32px var(--shadow),inset 0 1px 0 var(--edge);
-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
.logo svg{width:44px;height:44px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
h1{margin:0 0 6px;font-size:1.85rem;font-weight:800;letter-spacing:-.2px}
header p{margin:0;color:var(--mute);font-size:1rem}
.links{display:flex;flex-direction:column;gap:13px}
.btn{position:relative;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:20px;color:var(--ink);text-decoration:none;
background:var(--glass);border:1px solid var(--edge);box-shadow:0 8px 24px var(--shadow),inset 0 1px 0 var(--edge);
-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);
transition:transform .18s,background .18s,box-shadow .18s;overflow:hidden}
.btn::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.28),transparent 45%);pointer-events:none}
.btn:hover,.btn:focus-visible{background:var(--glass-h);transform:translateY(-3px);box-shadow:0 14px 32px var(--shadow),0 0 0 1px var(--c),inset 0 1px 0 var(--edge)}
.btn:focus-visible{outline:2px solid var(--c);outline-offset:3px}
.btn:active{transform:scale(.98)}
.ic{position:relative;flex:none;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;
background:linear-gradient(145deg,var(--c),var(--c2,var(--c)));box-shadow:0 6px 16px color-mix(in srgb,var(--c) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.4)}
.ic svg{width:25px;height:25px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.txt{flex:1;font-weight:700;font-size:1.06rem;line-height:1.35}
.txt small{display:block;color:var(--mute);font-weight:400;font-size:.8rem}
.chev{width:20px;height:20px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.call{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 80%,transparent),color-mix(in srgb,#9f1239 80%,transparent));border-color:rgba(255,255,255,.5);color:#fff;padding:16px 14px}
.call .txt small,.call .chev{color:rgba(255,255,255,.85);stroke:#fff}
.call .ic{background:rgba(255,255,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.call:hover,.call:focus-visible{background:linear-gradient(135deg,var(--accent),#9f1239)}
.chev{transition:transform .2s}
.pay summary{list-style:none;cursor:pointer}
.pay summary::-webkit-details-marker{display:none}
.pay[open] .chev{transform:rotate(-90deg)}
.panel{margin-top:8px;padding:12px;border-radius:18px;display:flex;flex-direction:column;gap:10px;background:var(--glass);border:1px solid var(--edge);box-shadow:0 8px 24px var(--shadow),inset 0 1px 0 var(--edge);-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%)}
.row{display:flex;align-items:center;gap:10px}
.lbl{flex:none;width:82px;font-size:.78rem;color:var(--mute)}
.val{flex:1;min-width:0;font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy{flex:none;font:inherit;font-size:.85rem;font-weight:600;color:#fff;text-decoration:none;background:linear-gradient(145deg,var(--c),var(--c2,var(--c)));border:0;border-radius:11px;padding:7px 14px;cursor:pointer}
.copy:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.copy{min-width:92px;text-align:center;transition:background .2s}
.copy.done{background:linear-gradient(145deg,#22c55e,#15803d);animation:pop .4s ease}
.val.flash{animation:flash 1.4s ease}
@keyframes pop{40%{transform:scale(1.12)}}
@keyframes flash{from{color:#22c55e;text-shadow:0 0 14px rgba(34,197,94,.8)}}
@media (prefers-reduced-motion:reduce){.copy.done,.val.flash{animation:none}}
footer{margin-top:30px;text-align:center;color:var(--mute);font-size:.85rem}
@keyframes rise{from{opacity:0;transform:translateY(46px) scale(.97)}}
.links>*{animation:rise 1.3s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i,0) * 220ms + 300ms)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.links>*{animation:none}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.btn,.logo{background:var(--glass-h)}}
.logo{width:min(260px,72%);height:auto;padding:6px;border-radius:30px;background:rgba(255,255,255,.94);display:block}
.logo img{display:block;width:100%;height:auto;border-radius:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo{width:min(200px,56%);padding:0;border:0;border-radius:0;background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;margin-bottom:6px}
.logo img{border-radius:0}
header p.tag{margin:0;font-size:1.05rem;font-weight:600;letter-spacing:.4px;color:var(--ink)}
header p.ar{margin:4px 0 0;font-size:.9rem;color:var(--mute)}
</style>
</head>

  a.className = "btn" + (l.cls ? " " + l.cls : "");
  a.href = l.u;
  if (l.u.indexOf("http") === 0) { a.target = "_blank"; a.rel = "noopener"; }
  a.style.setProperty("--c", l.c);
  if (l.c2) a.style.setProperty("--c2", l.c2);
  a.innerHTML = '<span class="ic">' + ICONS[l.i] + '</span><span class="txt">' + l.t + '<small>' + l.s + '</small></span>' + CHEV;
  nav.appendChild(a);
});
PAYS.forEach(function(p){
  var d = document.createElement("details");
  d.className = "pay";
  d.style.setProperty("--c", p.c);
  d.style.setProperty("--c2", p.c2);
  d.innerHTML = '<summary class="btn"><span class="ic">' + ICONS.pay + '</span><span class="txt">' + p.t + '<small>' + p.s + '</small></span>' + CHEV + '</summary>' +
    '<div class="panel">' +
    '<div class="row"><span class="lbl">رقم المحفظة</span><span class="val" dir="ltr">' + p.wallet + '</span><button type="button" class="copy" data-v="' + p.wallet + '">نسخ</button></div>' +
    '<div class="row"><span class="lbl">رابط إنستاباي</span><span class="val" dir="ltr">' + p.ipn + '</span><a class="copy" href="' + p.ipn + '" target="_blank" rel="noopener">فتح</a></div>' +
    '</div>';
  d.addEventListener("toggle", function(){
    if (d.open) document.querySelectorAll(".pay[open]").forEach(function(o){ if (o !== d) o.removeAttribute("open"); });
  });
  nav.appendChild(d);
});
Array.prototype.forEach.call(nav.children, function(el, i){ el.style.setProperty("--i", i); });
nav.addEventListener("click", function(e){
  var b = e.target.closest(".copy[data-v]");
  if (!b) return;
  var v = b.getAttribute("data-v");
  function ok(){
    if (!b.dataset.o) b.dataset.o = b.textContent;
    var val = b.parentNode.querySelector(".val");
    b.textContent = "✓ تم النسخ";
    b.classList.remove("done"); val.classList.remove("flash"); void b.offsetWidth;
    b.classList.add("done"); val.classList.add("flash");
    try { if (navigator.vibrate) navigator.vibrate(30); } catch(x) {}
    clearTimeout(b._t);
    b._t = setTimeout(function(){ b.textContent = b.dataset.o; b.classList.remove("done"); val.classList.remove("flash"); }, 1800);
  }
  function fb(){
    var t = document.createElement("textarea");
    t.value = v; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); ok(); } catch(x) {}
    document.body.removeChild(t);
  }
  try { navigator.clipboard.writeText(v).then(ok, fb); } catch(x) { fb(); }
});
</script>
</body>
</html>
